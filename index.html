<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Irregular Quest V3</title>
<style>
:root{--b:#506cff;--bg:#f5f7fc;--ink:#172033;--mut:#6c7588;--ok:#1c9b62;--bad:#d94b59;--gold:#f1ad29}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:16px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}.streak{background:#fff0d9;padding:8px 12px;border-radius:99px;font-weight:800}.prog{height:11px;background:#dfe4ee;border-radius:20px;overflow:hidden}.prog i{display:block;height:100%;background:var(--b)}.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}.panel{background:#fff;border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 10px 35px #24304a12}.tag{color:var(--b);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}button{border:0;font:inherit;font-weight:750;cursor:pointer}.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.tile{padding:18px;text-align:left;border-radius:17px;background:#edf1ff}.tile b{display:block;font-size:18px}.tile small,.hint{color:var(--mut)}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:22px 0 14px}.slot{min-height:112px;border:2px solid #e3e7ef;border-radius:17px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;background:#fafbfe}.lab{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:850;margin-bottom:9px}.val{font-size:19px;font-weight:850;overflow-wrap:anywhere}.missing{border:2px dashed var(--b);background:#f0f3ff}.missing .val{font-size:30px;color:var(--b)}.slot.good{border-color:var(--ok);background:#ebf9f2}.slot.bad{border-color:var(--bad);background:#fff0f1}.slot input{width:100%;min-width:0;padding:10px 5px;text-align:center;border:1.5px solid #ccd4e4;border-radius:10px;font-size:16px;font-weight:750}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.opt{padding:13px 8px;border-radius:13px;background:#edf1f7}.primary{width:100%;padding:14px;border-radius:14px;background:var(--b);color:#fff;margin-top:12px}.secondary{padding:13px;border-radius:14px;background:#e9edf4}.feedback{padding:13px;border-radius:13px;margin-top:12px;font-weight:700}.feedback.ok{background:#e8f8f0;color:#147348}.feedback.no{background:#fff0f1;color:#a82d3c}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#f5f7fb;padding:12px;text-align:center;border-radius:13px}.stat b{display:block;font-size:20px}.listrow{padding:10px 0;border-bottom:1px solid #edf0f5}.stars{float:right;color:var(--gold)}.hint{text-align:center;font-size:13px}.result{text-align:center;font-size:34px;font-weight:900;margin:24px}@media(max-width:620px){.four{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr}.options{grid-template-columns:1fr}.slot{min-height:105px}}
</style></head><body><div class="app"><div class="top"><h1>🇬🇧 Irregular Quest <small>V3</small></h1><div class="streak" id="streak"></div></div><div class="prog"><i id="bar"></i></div><div class="meta"><span id="pm"></span><span id="stars"></span></div>
<div id="home" class="panel"><div class="tag">Mission</div><h2>Conquiers les 60 verbes !</h2><p>Les 4 cases restent toujours dans le même ordre. Les erreurs reviennent plus souvent.</p><div class="menu"><button class="tile" onclick="start(false)"><b>🎮 Entraînement</b><small>QCM puis écriture</small></button><button class="tile" onclick="start(true)"><b>🏆 Évaluation</b><small>20 verbes, 2 ou 3 cases à remplir</small></button><button class="tile" onclick="showList()"><b>📚 Mes verbes</b><small>Voir les étoiles</small></button><button class="tile" onclick="resetAll()"><b>↻ Recommencer</b><small>Effacer la progression</small></button></div><div class="stats"><div class="stat"><b id="mastered"></b><small>maîtrisés</small></div><div class="stat"><b id="attempts"></b><small>réponses</small></div><div class="stat"><b id="acc"></b><small>réussite</small></div></div></div>
<div id="quiz" class="panel hidden"><div class="tag" id="mode"></div><div class="hint" id="hint"></div><div class="four" id="four"></div><div id="opts" class="options"></div><button id="validate" class="primary hidden" onclick="validateTyped()">Valider les cases</button><div id="feed" class="hidden"></div><button id="replay" class="secondary hidden" style="width:100%;margin-top:12px" onclick="replay()">🔊 Réécouter la ligne</button><button id="next" class="primary hidden" onclick="next()">Question suivante →</button><button class="secondary" style="width:100%;margin-top:10px" onclick="goHome()">← Accueil</button></div>
<div id="list" class="panel hidden"><div class="tag">Mes verbes</div><div id="rows"></div><button class="secondary" style="width:100%;margin-top:12px" onclick="goHome()">← Accueil</button></div></div>
<script>
const verbs=[{"inf": "be", "past": "was/were", "pp": "been", "fr": "être"}, {"inf": "beat", "past": "beat", "pp": "beaten", "fr": "battre"}, {"inf": "become", "past": "became", "pp": "become", "fr": "devenir"}, {"inf": "begin", "past": "began", "pp": "begun", "fr": "commencer"}, {"inf": "bite", "past": "bit", "pp": "bitten", "fr": "mordre"}, {"inf": "blow", "past": "blew", "pp": "blown", "fr": "souffler"}, {"inf": "break", "past": "broke", "pp": "broken", "fr": "casser"}, {"inf": "bring", "past": "brought", "pp": "brought", "fr": "apporter"}, {"inf": "build", "past": "built", "pp": "built", "fr": "construire"}, {"inf": "buy", "past": "bought", "pp": "bought", "fr": "acheter"}, {"inf": "catch", "past": "caught", "pp": "caught", "fr": "attraper"}, {"inf": "choose", "past": "chose", "pp": "chosen", "fr": "choisir"}, {"inf": "come", "past": "came", "pp": "come", "fr": "venir"}, {"inf": "cost", "past": "cost", "pp": "cost", "fr": "coûter"}, {"inf": "cut", "past": "cut", "pp": "cut", "fr": "couper"}, {"inf": "do", "past": "did", "pp": "done", "fr": "faire"}, {"inf": "dream", "past": "dreamt", "pp": "dreamt", "fr": "rêver"}, {"inf": "drink", "past": "drank", "pp": "drunk", "fr": "boire"}, {"inf": "drive", "past": "drove", "pp": "driven", "fr": "conduire"}, {"inf": "eat", "past": "ate", "pp": "eaten", "fr": "manger"}, {"inf": "fall", "past": "fell", "pp": "fallen", "fr": "tomber"}, {"inf": "feel", "past": "felt", "pp": "felt", "fr": "se sentir, toucher"}, {"inf": "fight", "past": "fought", "pp": "fought", "fr": "se battre"}, {"inf": "find", "past": "found", "pp": "found", "fr": "trouver"}, {"inf": "fly", "past": "flew", "pp": "flown", "fr": "voler"}, {"inf": "forget", "past": "forgot", "pp": "forgotten", "fr": "oublier"}, {"inf": "get", "past": "got", "pp": "got", "fr": "obtenir"}, {"inf": "give", "past": "gave", "pp": "given", "fr": "donner"}, {"inf": "go", "past": "went", "pp": "gone", "fr": "aller"}, {"inf": "have", "past": "had", "pp": "had", "fr": "avoir"}, {"inf": "hear", "past": "heard", "pp": "heard", "fr": "entendre"}, {"inf": "hide", "past": "hid", "pp": "hidden", "fr": "cacher"}, {"inf": "hit", "past": "hit", "pp": "hit", "fr": "frapper"}, {"inf": "hurt", "past": "hurt", "pp": "hurt", "fr": "blesser"}, {"inf": "keep", "past": "kept", "pp": "kept", "fr": "garder"}, {"inf": "know", "past": "knew", "pp": "known", "fr": "connaître, savoir"}, {"inf": "leave", "past": "left", "pp": "left", "fr": "quitter, partir"}, {"inf": "make", "past": "made", "pp": "made", "fr": "faire, fabriquer"}, {"inf": "meet", "past": "met", "pp": "met", "fr": "rencontrer"}, {"inf": "pay", "past": "paid", "pp": "paid", "fr": "payer"}, {"inf": "put", "past": "put", "pp": "put", "fr": "mettre"}, {"inf": "read", "past": "read", "pp": "read", "fr": "lire"}, {"inf": "run", "past": "ran", "pp": "run", "fr": "courir"}, {"inf": "say", "past": "said", "pp": "said", "fr": "dire"}, {"inf": "see", "past": "saw", "pp": "seen", "fr": "voir"}, {"inf": "send", "past": "sent", "pp": "sent", "fr": "envoyer"}, {"inf": "shut", "past": "shut", "pp": "shut", "fr": "fermer"}, {"inf": "sing", "past": "sang", "pp": "sung", "fr": "chanter"}, {"inf": "sit", "past": "sat", "pp": "sat", "fr": "être assis"}, {"inf": "sleep", "past": "slept", "pp": "slept", "fr": "dormir"}, {"inf": "smell", "past": "smelt", "pp": "smelt", "fr": "sentir"}, {"inf": "speak", "past": "spoke", "pp": "spoken", "fr": "parler"}, {"inf": "spend", "past": "spent", "pp": "spent", "fr": "passer, dépenser"}, {"inf": "take", "past": "took", "pp": "taken", "fr": "prendre"}, {"inf": "tell", "past": "told", "pp": "told", "fr": "dire, raconter"}, {"inf": "think", "past": "thought", "pp": "thought", "fr": "penser"}, {"inf": "understand", "past": "understood", "pp": "understood", "fr": "comprendre"}, {"inf": "wake", "past": "woke", "pp": "woken", "fr": "réveiller"}, {"inf": "win", "past": "won", "pp": "won", "fr": "gagner"}, {"inf": "write", "past": "wrote", "pp": "written", "fr": "écrire"}],fields=['inf','past','pp','fr'],labels={inf:'Infinitif',past:'Prétérit',pp:'Participe passé',fr:'Français'};
let state=JSON.parse(localStorage.getItem('irq-state-v2')||'null')||{v:{},attempts:0,correct:0,streak:0};verbs.forEach(v=>state.v[v.inf]??={stage:0,wins:0,miss:0});
let ev=false,session=[],qi=0,cur=null,score=0;const $=x=>document.getElementById(x),norm=s=>s.toLowerCase().trim().replace(/\s+/g,' ');
function save(){localStorage.setItem('irq-state-v2',JSON.stringify(state));head()}function mastered(){return verbs.filter(v=>state.v[v.inf].stage>=4).length}
function head(){$('streak').textContent='🔥 '+state.streak;$('bar').style.width=(mastered()/60*100)+'%';$('pm').textContent=mastered()+' / 60 maîtrisés';let a=Math.floor(Object.values(state.v).reduce((x,s)=>x+s.stage,0)/60);$('stars').textContent='★'.repeat(a)+'☆'.repeat(4-a)}
function stats(){$('mastered').textContent=mastered();$('attempts').textContent=state.attempts;$('acc').textContent=state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—'}
function goHome(){$('home').classList.remove('hidden');$('quiz').classList.add('hidden');$('list').classList.add('hidden');head();stats()}
function weighted(){let bag=[];verbs.forEach(v=>{let s=state.v[v.inf],w=1+(4-s.stage)*2+s.miss*3;for(let i=0;i<w;i++)bag.push(v)});return bag[Math.floor(Math.random()*bag.length)]}
function start(e){ev=e;session=[];qi=0;score=0;for(let i=0;i<(e?20:10);i++)session.push(weighted());$('home').classList.add('hidden');$('list').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){if(qi>=session.length)return finish();let v=session[qi],st=state.v[v.inf].stage,n=ev?(Math.random()<.55?2:3):1,missing=[...fields].sort(()=>Math.random()-.5).slice(0,n),typed=ev||st>=2;cur={v,missing,typed};$('mode').textContent=(ev?'Évaluation':'Entraînement')+' • '+(qi+1)+'/'+session.length;$('hint').textContent=ev?'Complète toutes les cases vides.':typed?'Écris la case manquante.':'Choisis la bonne réponse pour la case « ? ».';
$('four').innerHTML='';fields.forEach(f=>{let d=document.createElement('div');d.className='slot '+(missing.includes(f)?'missing':'');d.dataset.f=f;d.innerHTML='<div class="lab">'+labels[f]+'</div>';d.innerHTML+=missing.includes(f)?(typed?'<input data-field="'+f+'" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="?">':'<div class="val">?</div>'):'<div class="val">'+v[f]+'</div>';$('four').appendChild(d)});$('opts').innerHTML='';$('feed').className='hidden';$('next').classList.add('hidden');$('replay').classList.add('hidden');$('validate').classList.toggle('hidden',!typed);
if(!typed){let f=missing[0],a=[v[f]];while(a.length<3){let z=verbs[Math.floor(Math.random()*verbs.length)][f];if(!a.includes(z))a.push(z)}a.sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>judgeMC(x);$('opts').appendChild(b)})}}
function accepted(f,r,t){let a=norm(r),b=norm(t);if(f==='past'&&b==='was/were')return ['was/were','was were','was, were','was / were'].includes(a);if(f==='fr')return b.split(',').map(norm).includes(a)||a===b;return a===b}
function mark(f,ok){let d=document.querySelector('.slot[data-f="'+f+'"]');d.classList.remove('missing');d.classList.add(ok?'good':'bad')}
function judgeMC(x){let f=cur.missing[0],ok=accepted(f,x,cur.v[f]);mark(f,ok);done(ok)}
function validateTyped(){let ok=true;cur.missing.forEach(f=>{let i=document.querySelector('input[data-field="'+f+'"]'),o=accepted(f,i.value,cur.v[f]);ok=ok&&o;mark(f,o);i.disabled=true});done(ok)}
function speakLine(v){
 if(!('speechSynthesis' in window))return;
 window.speechSynthesis.cancel();
 const en=new SpeechSynthesisUtterance(v.inf+', '+v.past+', '+v.pp);
 en.lang='en-GB'; en.rate=.72; en.pitch=1;
 const voices=window.speechSynthesis.getVoices();
 const british=voices.find(x=>/^en-GB/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));
 if(british)en.voice=british;
 en.onend=()=>{
   const fr=new SpeechSynthesisUtterance(v.fr);
   fr.lang='fr-FR'; fr.rate=.78;
   const fv=voices.find(x=>/^fr-FR/i.test(x.lang))||voices.find(x=>/^fr/i.test(x.lang));
   if(fv)fr.voice=fv;
   window.speechSynthesis.speak(fr);
 };
 window.speechSynthesis.speak(en);
}
function replay(){if(cur&&cur.v)speakLine(cur.v)}
function done(ok){$('opts').innerHTML='';$('validate').classList.add('hidden');if(ev){if(ok)score++}else{let s=state.v[cur.v.inf];state.attempts++;if(ok){state.correct++;state.streak++;s.wins++;if(s.wins>=1&&s.stage<4){s.stage++;s.wins=0}}else{state.streak=0;s.miss++;s.wins=0;if(s.stage>0)s.stage--;if(qi+3<session.length)session.splice(Math.min(session.length,qi+3),0,cur.v)}save();$('feed').className='feedback '+(ok?'ok':'no');$('feed').innerHTML=ok?'✓ Bravo !':'✗ '+cur.v.inf+' – '+cur.v.past+' – '+cur.v.pp+' – '+cur.v.fr}$('next').classList.remove('hidden');if(!ev){$('replay').classList.remove('hidden');speakLine(cur.v)}}
function next(){qi++;render()}function finish(){$('four').innerHTML='';$('opts').innerHTML='';$('validate').classList.add('hidden');$('next').classList.add('hidden');$('replay').classList.add('hidden');$('mode').textContent=ev?'Résultat':'Séance terminée 🎉';$('hint').innerHTML=ev?'<div class="result">'+score+' / '+session.length+'</div>':"Bravo ! Les erreurs reviendront plus souvent."}
function showList(){$('home').classList.add('hidden');$('quiz').classList.add('hidden');$('list').classList.remove('hidden');$('rows').innerHTML=verbs.map(v=>'<div class="listrow"><b>'+v.inf+' – '+v.past+' – '+v.pp+'</b><span class="stars">'+'★'.repeat(state.v[v.inf].stage)+'☆'.repeat(4-state.v[v.inf].stage)+'</span><br><small>'+v.fr+'</small></div>').join('')}
function resetAll(){if(confirm('Effacer toute la progression ?')){localStorage.removeItem('irq-state-v2');location.reload()}}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('validate').classList.contains('hidden'))validateTyped()});head();stats();
</script></body></html>
